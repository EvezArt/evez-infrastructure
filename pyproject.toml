[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evez-infrastructure"
version = "0.1.0"
description = "Self-sustaining AI infrastructure — 32 models, 8 providers, cryptographic event sourcing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Steven Crawford-Maggard", email = "steven@evez-os.ai"}]
keywords = ["evez", "infrastructure", "terraform", "iac"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
